spring:
  application:
    name: analyzer

  datasource:
    url: ${ANALYZER_DB_URL:jdbc:postgresql://localhost:5432/analyzer}
    username: ${ANALYZER_DB_USERNAME:postgres}
    password: ${ANALYZER_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    create-schemas: true

analyzer:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumers:
      hub-events:
        topic: telemetry.hubs.v1
        group-id: ${ANALYZER_HUB_EVENTS_GROUP_ID:analyzer-hub-events}
        poll-timeout-ms: 1000
        max-poll-records: 200
        enable-auto-commit: false

      snapshots:
        topic: telemetry.snapshots.v1
        group-id: ${ANALYZER_SNAPSHOTS_GROUP_ID:analyzer-snapshots}
        poll-timeout-ms: 1000
        max-poll-records: 200
        enable-auto-commit: false

grpc:
  client:
    hub-router:
      address: ${HUB_ROUTER_ADDRESS:static://localhost:59090}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
