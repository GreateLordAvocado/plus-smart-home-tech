syntax = "proto3";

package telemetry.message.event;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.telemetry.event";

message ClimateSensorProto {
  int32 temperature_c = 1;
  int32 humidity = 2;
  int32 co2_level = 3;
}

message LightSensorProto {
  int32 link_quality = 1;
  int32 luminosity = 2;
}

message MotionSensorProto {
  int32 link_quality = 1;
  bool motion = 2;
  int32 voltage = 3;
}

message SwitchSensorProto {
  bool state = 1;
}

message TemperatureSensorProto {
  int32 temperature_c = 1;
  int32 temperature_f = 2;
}

message SensorEventProto {
  bytes id = 1; // UUID in binary (16 bytes)

  string hub_id = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof payload {
    ClimateSensorProto climate = 4;
    LightSensorProto light = 5;
    MotionSensorProto motion = 6;
    SwitchSensorProto switch_sensor = 7;
    TemperatureSensorProto temperature = 8;
  }
}
