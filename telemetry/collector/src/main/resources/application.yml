spring:
  application:
    name: collector

grpc:
  server:
    port: ${COLLECTOR_GRPC_PORT:59091}

collector:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    topics:
      sensors: telemetry.sensors.v1
      hubs: telemetry.hubs.v1

    producer:
      acks: "1"
      linger-ms: 5
      batch-size: 32768
