services:
  analyzer-postgres:
    image: postgres:14.11
    container_name: analyzer-postgres
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - analyzer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analyzer"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  analyzer_pg_data:
